name: Check chapter keepsakes
on:
  push:
    branches: [feat/page-keepsakes]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          node build-preview.cjs
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1
      - name: Review keepsake placement
        run: node keepsake-review.cjs
      - name: Check editor and gifts
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node editor-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keepsake-review
          path: qa/*.png
