name: Deploy birthday site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare website
        env:
          SITE_SOURCE: albedo-beidou-birthday-codex-v4/birthday_codex_albedo_beidou
        run: |
          mkdir -p _site
          cp "$SITE_SOURCE/index.html" "$SITE_SOURCE/"*.css "$SITE_SOURCE/"*.js _site/
          cp -R "$SITE_SOURCE/assets" _site/assets
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
