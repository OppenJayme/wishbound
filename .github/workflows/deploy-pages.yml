name: Deploy birthday site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build portable HTML preview
        env:
          SITE_SOURCE: site
        run: |
          node build-preview.cjs
          mkdir -p _site
          cp "$SITE_SOURCE/ONE_FILE_PREVIEW.html" _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Check the gift editor and exported HTML
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1
          node editor-qa.cjs

      - name: Check book layouts on laptops, monitors, and phones
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node viewport-qa.cjs

      - name: Save editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshots
          path: |
            qa/editor-*.png
            qa/viewport-*.png
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
