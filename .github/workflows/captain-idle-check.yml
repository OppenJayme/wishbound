name: Check captain idle motion
on:
  push:
    branches: [feat/captain-idle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the gift and record the captain charm
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node build-preview.cjs
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1
          npx playwright install ffmpeg
          node editor-qa.cjs
          node charm-motion-check.cjs
      - name: Save screenshots and motion recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captain-idle-check
          path: qa/
          if-no-files-found: ignore
