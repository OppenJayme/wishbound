name: Check birthday opening
on:
  push:
    branches: [feat/birthday-opening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and check birthday opening, editor, and exported gifts
        env:
          CHROME_PATH: /usr/bin/google-chrome
          RECORD_BIRTHDAY_VIDEO: '1'
        run: |
          node build-preview.cjs
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1
          npx playwright install ffmpeg
          node editor-qa.cjs
      - name: Save verification images and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birthday-opening-check
          path: qa/
          if-no-files-found: ignore
