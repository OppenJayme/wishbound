name: Check local gift editor
on:
  push:
    branches: [feat/local-gift-editor]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node build-preview.cjs
      - name: Check editor and offline gifts
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.62.1
          node editor-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-gift-screenshots
          path: qa/editor-*.png
